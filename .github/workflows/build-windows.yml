name: Build Windows Setup Pack

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub Release tag to attach the Windows zip to (e.g. v0.9.3)'
        type: string
        default: 'v0.9.3'
      embed_toolchain:
        description: 'Embed portable cmake-clang-v1 Windows toolchain (~200 MB, zero installs for players)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows-x64:
    name: windows-x64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert clean tree (no generated C or stray zips)
        run: |
          set -euo pipefail
          if compgen -G 'src/gen/*.c' >/dev/null || [[ -f recomp/funcs.h ]]; then
            echo "::error::src/gen/*.c or recomp/funcs.h is present in the checkout."
            exit 1
          fi
          if compgen -G '*.zip' >/dev/null; then
            echo "::error::Stray .zip archive found in repo root: $(ls -1 *.zip)"
            exit 1
          fi

      - name: Cache toolchain pack
        uses: actions/cache@v4
        with:
          path: .cache/toolchain-pack
          key: cmake-clang-v1-windows-x64-latest

      - name: Fetch Windows toolchain pack
        run: |
          set -euo pipefail
          bash snesrecomp/tools/ci/fetch_toolchain.sh --artifact windows-x64

      - name: Configure and build Windows Setup Host
        run: |
          set -euo pipefail
          source "${TOOLCHAIN_DIR}/env.sh"
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "Building Evertopia ${VER} Setup Host for windows-x64..."
          echo "cmake: $(command -v cmake) ($(cmake --version | head -n1))"
          echo "cc:    ${CC:-$(command -v cc)}"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SETUP_HOST=ON \
            -DSNESRECOMP_CRC32_IMPL=SLICE8 \
            -DSNESRECOMP_ENABLE_TRACE=OFF \
            -DSNESRECOMP_BUILD_VERSION="${VER}"
          cmake --build build-ci -j4 --target Evertopia
          ls -lh build-ci/Evertopia.exe

      - name: Package Windows Setup Pack
        run: |
          set -euo pipefail
          source "${TOOLCHAIN_DIR}/env.sh"
          ARGS=()
          if [[ "${{ inputs.embed_toolchain }}" != "false" ]]; then
            ARGS+=(--embed-toolchain)
          fi
          bash scripts/package_release.sh build-ci windows-x64 "${ARGS[@]+"${ARGS[@]}"}"
          ls -lh dist/

      - name: Smoke-test unpacked Windows Setup Pack (player rebuild flow)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem -Path dist -Filter 'evertopia-*-windows-x64.zip' | Select-Object -First 1).FullName
          if (-not $zip) { throw "Windows setup zip not found in dist/" }

          # 1. Verify no stray .zip files or ROMs are embedded in the archive.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $arch = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $bad = $arch.Entries | Where-Object { $_.FullName -match '\.(zip|smc|sfc|srm)$' }
            if ($bad) {
              throw "Forbidden files inside Windows zip: $($bad.FullName -join ', ')"
            }
          } finally {
            $arch.Dispose()
          }

          # 2. Unpack into a directory with spaces & parentheses (like Windows Downloads/LaunchBox).
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'Evertopia Smoke (1)'
          if (Test-Path $smokeRoot) { Remove-Item -Recurse -Force $smokeRoot }
          Expand-Archive -Path $zip -DestinationPath $smokeRoot -Force
          $packDir = (Get-ChildItem -Path $smokeRoot -Directory | Select-Object -First 1).FullName
          Write-Host "Unpacked to: $packDir"

          # 3. Verify key files exist.
          foreach ($rel in @('Evertopia.exe', 'CMakeLists.txt', 'snesrecomp\snesrecomp_cli.py', 'recomp\bank00.cfg', 'toolchain\env.bat')) {
            $p = Join-Path $packDir $rel
            if (-not (Test-Path $p)) { throw "Missing required file in setup pack: $rel" }
          }

          # 4. Run the exact configure + --target Evertopia build using ONLY the embedded toolchain\env.bat.
          $cmdLines = @(
            '@echo off'
            'setlocal EnableExtensions'
            "set `"PACK=$packDir\toolchain`""
            "set `"ROOT=$packDir`""
            "set `"BUILD_DIR=$packDir\build`""
            'call "%PACK%\env.bat"'
            'if errorlevel 1 exit /b 1'
            'cd /d "%ROOT%"'
            'cmake -S "%ROOT%" -B "%BUILD_DIR%" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SETUP_HOST=ON -DSNESRECOMP_CRC32_IMPL=SLICE8'
            'if errorlevel 1 exit /b 1'
            'powershell -NoProfile -Command "& cmake --build $env:BUILD_DIR --parallel --target Evertopia 2>&1 | Tee-Object -FilePath (Join-Path $env:BUILD_DIR ''snesrecomp_rebuild.log'') -Append; exit $LASTEXITCODE"'
            'if errorlevel 1 exit /b 1'
            'if not exist "%BUILD_DIR%\Evertopia.exe" exit /b 1'
          )
          $cmdFile = Join-Path $smokeRoot 'smoke_build.cmd'
          [System.IO.File]::WriteAllText($cmdFile, ($cmdLines -join "`r`n") + "`r`n", [System.Text.Encoding]::ASCII)
          & cmd.exe /c $cmdFile
          if ($LASTEXITCODE -ne 0) { throw "Embedded-toolchain player rebuild smoke test failed (exit $LASTEXITCODE)" }

          $rebuilt = Get-Item (Join-Path $packDir 'build\Evertopia.exe')
          Write-Host "Smoke test PASSED! Rebuilt: $($rebuilt.FullName) ($($rebuilt.Length) bytes)"
          Remove-Item -Recurse -Force $smokeRoot

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: evertopia-windows-x64
          path: dist/evertopia-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Attach Windows zip to GitHub Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/evertopia-*-windows-x64.zip --clobber
